name: Release

on:
  push:
    tags: ["v*"]

# Releases are never cancelled mid-flight: a superseded run would leave a
# half-created GitHub release behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  WAILS_VERSION: v2.14.0
  NODE_VERSION: "22"

jobs:
  macos-dmg:
    name: Build the macOS DMG and publish the release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Put GOPATH/bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install the Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # v0.1.0 -> 0.1.0. Only names the DMG; the bundle's own version comes
      # from `info.productVersion` in wails.json, so bump that in the same
      # commit you tag.
      - name: Derive the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: wails build
        run: wails build

      - name: go test
        run: go test ./...

      # ==================================================================
      # Developer ID signing + notarization: self-enabling.
      #
      # These steps turn themselves on the moment the repository has the
      # secrets for them, and skip cleanly when it does not — there is no
      # switch to remember to flip. `SIGNING` below is "true" only when every
      # required secret is non-empty, so a half-configured repository (cert
      # but no notary key) still produces a release instead of failing at the
      # last step; the "signing status" step says which secrets are missing.
      #
      # Secrets (Settings -> Secrets and variables -> Actions):
      #   MACOS_CERTIFICATE       base64 of a "Developer ID Application" .p12
      #                           export (`base64 -i cert.p12 | pbcopy`)
      #   MACOS_CERTIFICATE_PWD   password for that .p12
      #   MACOS_SIGNING_IDENTITY  e.g. "Developer ID Application: Your Name
      #                           (TEAMID)" — optional; sign.sh picks the
      #                           imported Developer ID certificate itself
      #   NOTARY_KEY_P8           contents of the App Store Connect API key
      #                           .p8 (App Store Connect -> Users and Access
      #                           -> Integrations -> App Store Connect API)
      #   NOTARY_KEY_ID           that key's Key ID
      #   NOTARY_ISSUER           the Issuer ID shown above the key list
      #
      # An API key is used rather than an Apple ID + app-specific password so
      # no account password material lives in CI and the credential can be
      # revoked on its own. `scripts/notarize.sh` accepts either.
      #
      # Without the secrets, releases carry the ad-hoc signature `wails build`
      # applies: they run, but Gatekeeper asks for a right-click -> Open on
      # first launch and the identity changes every build (macOS then resets
      # the app's TCC permissions — see README).
      #
      # Notarization is asynchronous; `notarytool submit --wait` blocks until
      # Apple answers (usually a few minutes, occasionally much longer), hence
      # the generous job timeout.
      # ==================================================================
      - name: Decide whether this release can be signed and notarized
        id: signing
        env:
          HAVE_CERT: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PWD != '' }}
          HAVE_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER != '' }}
        run: |
          if [ "$HAVE_CERT" = "true" ] && [ "$HAVE_NOTARY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Developer ID signing and notarization are enabled for this release."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Releasing an ad-hoc signed DMG (right-click -> Open needed on first launch)."
            [ "$HAVE_CERT" = "true" ]   || echo "::warning::missing secrets: MACOS_CERTIFICATE / MACOS_CERTIFICATE_PWD"
            [ "$HAVE_NOTARY" = "true" ] || echo "::warning::missing secrets: NOTARY_KEY_P8 / NOTARY_KEY_ID / NOTARY_ISSUER"
          fi

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Sign the app bundle with Developer ID
        if: steps.signing.outputs.enabled == 'true'
        run: scripts/sign.sh "${{ secrets.MACOS_SIGNING_IDENTITY }}"

      # The volume is named MDv so the Finder window title matches the product
      # name, and the bundle is staged under that name for the same reason.
      - name: Build the DMG
        run: |
          STAGE="$(mktemp -d)"
          cp -R build/bin/md-view.app "$STAGE/MDv.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "MDv" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "build/bin/md-view-$VERSION.dmg"
          hdiutil verify "build/bin/md-view-$VERSION.dmg"

      # A freshly created disk image carries no signature of its own; sign it
      # so the file people download is verifiable, and so notarization submits
      # one signed unit rather than an unsigned wrapper.
      - name: Sign the DMG with Developer ID
        if: steps.signing.outputs.enabled == 'true'
        run: scripts/sign.sh "${{ secrets.MACOS_SIGNING_IDENTITY }}" "build/bin/md-view-$VERSION.dmg"

      # See the comment block above for the secrets this needs.
      - name: Notarize and staple the DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          # The key must be a file for notarytool; keep it off the workspace
          # and remove it even if the submission fails.
          NOTARY_KEY="$(mktemp -d)/AuthKey.p8"
          trap 'rm -f "$NOTARY_KEY"' EXIT
          printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_KEY"
          export NOTARY_KEY
          scripts/notarize.sh "build/bin/md-view-$VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: md-view-${{ env.VERSION }}-macos-arm64-dmg
          path: build/bin/md-view-${{ env.VERSION }}.dmg
          if-no-files-found: error

      # Two bodies rather than one hedging paragraph: the release page should
      # state what this particular DMG is, not what it might be.
      - name: Publish the GitHub release (signed and notarized)
        if: steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/md-view-${{ env.VERSION }}.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## MDv ${{ github.ref_name }}

            Open the DMG and drag **MDv** into **Applications**, then
            double-click any `.md` file.

            Signed with a Developer ID certificate and notarized by Apple, so
            it opens without a Gatekeeper prompt.

      - name: Publish the GitHub release (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/md-view-${{ env.VERSION }}.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## MDv ${{ github.ref_name }}

            Open the DMG and drag **MDv** into **Applications**.

            This build is **ad-hoc signed and not notarized** — macOS
            Gatekeeper will ask you to right-click the app and choose **Open**
            the first time you launch it.
